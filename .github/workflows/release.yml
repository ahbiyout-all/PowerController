name: PowerController Windows Release (Setup Installer Only)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (e.g. v2.9.1)'
        required: false
        default: 'v2.9.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Setup Installer & Release
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------
      # Node.js 22 LTS Runtime Configuration (Deprecation Notice Compliant)
      # Note: Node.js 20 is officially End-of-Life (April 2026 EOL).
      # GitHub Actions runners require Node.js 22 LTS or Node.js 24.
      # -----------------------------------------------------------------
      - name: Setup Node.js (Node 22 LTS - Modern EOL Compliant)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Toolchain & Inno Setup 6
        shell: bash
        run: |
          npm ci
          pip install --upgrade pip
          pip install pyinstaller pillow pystray
          choco install innosetup --no-progress -y

      - name: Build Web Application
        shell: bash
        run: |
          npm run build

      - name: Build Windows Official Installer (.exe via Inno Setup 6)
        shell: cmd
        run: |
          python scripts/build_packages.py

      - name: Gather Clean Release Assets (Installer ONLY)
        shell: bash
        run: |
          mkdir -p release_assets
          # Collect ONLY official setup installer .exe
          cp -v build_output/pc/PowerController_Setup_*.exe release_assets/ 2>/dev/null || true
          
          # Fallback check
          if [ -d "dist" ]; then
            cp -v dist/PowerController_Setup_*.exe release_assets/ 2>/dev/null || true
          fi

          echo "================================================================"
          echo "Release Assets ready for upload (Official Installer ONLY):"
          ls -lh release_assets/
          echo "================================================================"

      - name: Determine Dynamic Version Tag
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_version }}" ]]; then
            TAG="${{ github.event.inputs.release_version }}"
          else
            TAG=$(node -p "try { 'v' + require('./package.json').version } catch(e) { 'v2.9.1' }")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target Version Tag: $TAG"

      - name: Upload Artifacts to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: PowerController-Setup-${{ steps.vars.outputs.tag }}
          path: release_assets/*
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: PowerController ${{ steps.vars.outputs.tag }} Windows 공식 설치 프로그램
          target_commitish: ${{ github.sha }}
          body: |
            ## 🚀 PowerController ${{ steps.vars.outputs.tag }} Windows 공식 릴리스

            ### 💿 Windows 공식 설치 파일 (Installer Asset Only)
            - 🖥️ **Windows PC 공식 설치 마법사**: `PowerController_Setup_${{ steps.vars.outputs.tag }}.exe`
              * Inno Setup 6 기반 폴더 풀림(Unpacked Multi-File) 개별 파일 설치
              * 기존 설치본 감지 시 삭제(클린 설치) 또는 덮어쓰기 선택 안내 다이얼로그
              * 무인 설치(/SILENT, /VERYSILENT) 완벽 지원
              * Windows Defender 방화벽 인바운드/아웃바운드 규칙 무음 자동 등록 (기본명 및 버전명)
              * 불필요한 개발용 문서 및 포터블 파일 배포 제외

            ---
            ### 📌 제작자 및 공식 채널 안내
            - **개발자**: `AhBiYout`
            - **GitHub 계정**: `AhBiYout-all` (https://github.com/AhBiYout-all)
            - **저장소**: `PowerController` (https://github.com/AhBiYout-all/PowerController)
            - **공식 구글 블로그**: https://ahbiyoutvibe.blogspot.com/
            - **소속사**: https://www.cisnet.co.kr
          files: release_assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune Non-Installer Assets from Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.vars.outputs.tag }}
        run: |
          python scripts/clean_github_release_assets.py "$GH_TOKEN" "$TAG_NAME"
